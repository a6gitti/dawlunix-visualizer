<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Beat Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100dvh; /* Dynamic viewport height for iOS Safari */
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ui-overlay {
      position: relative;
      z-index: 2;
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 24px);
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      pointer-events: none; /* Let clicks pass through to canvas if needed */
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .track-title {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      background: rgba(15, 15, 20, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      align-self: center;
      margin-bottom: 10px;
    }

    button, .file-label {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button:active, .file-label:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <canvas id="visualizer"></canvas>

  <div class="ui-overlay">
    <div class="top-bar">
      <div class="track-title" id="trackName">No beat loaded</div>
      <button id="colorBtn" title="New Random Colors">🎨 Colors</button>
    </div>

    <div class="controls">
      <label for="audioFile" class="file-label">Import Beat</label>
      <!-- accept="audio/*" ensures iOS Files app shows .mp3 and .wav properly -->
      <input type="file" id="audioFile" accept="audio/*,.mp3,.wav" />
      <button id="playPauseBtn" disabled>Play</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('audioFile');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const colorBtn = document.getElementById('colorBtn');
    const trackName = document.getElementById('trackName');

    let audioCtx;
    let analyser;
    let source;
    let audioElement = new Audio();
    audioElement.crossOrigin = "anonymous";
    // Required for inline playback without fullscreen takeover on iOS
    audioElement.setAttribute('playsinline', '');

    let isPlaying = false;
    let palette = generatePalette();

    // Handle High-DPI (Retina) displays dynamically on iPhone and Desktop
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Generate a cohesive random color scheme every time a beat is imported
    function generatePalette() {
      const baseHue = Math.floor(Math.random() * 360);
      const secondaryHue = (baseHue + 45 + Math.floor(Math.random() * 90)) % 360;
      const accentHue = (baseHue + 180) % 360;

      return {
        bg: `hsl(${baseHue}, 30%, 5%)`,
        primary: `hsl(${baseHue}, 90%, 60%)`,
        secondary: `hsl(${secondaryHue}, 85%, 55%)`,
        wave: `hsl(${accentHue}, 95%, 70%)`,
        glow: `hsla(${baseHue}, 100%, 60%, 0.4)`
      };
    }

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        // Smaller FFT size on mobile keeps performance smooth at 60fps
        analyser.fftSize = window.innerWidth < 600 ? 256 : 512;
        analyser.smoothingTimeConstant = 0.82;

        source = audioCtx.createMediaElementSource(audioElement);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      }

      // iOS Safari suspends AudioContext until a user gesture resumes it
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      initAudio();

      // Generate new random colors on every import
      palette = generatePalette();

      const fileURL = URL.createObjectURL(file);
      audioElement.src = fileURL;
      trackName.textContent = file.name.replace(/\.[^/.]+$/, "");
      playPauseBtn.disabled = false;

      audioElement.play().then(() => {
        isPlaying = true;
        playPauseBtn.textContent = 'Pause';
      }).catch(err => {
        console.warn("Playback waiting for user tap:", err);
        isPlaying = false;
        playPauseBtn.textContent = 'Play';
      });
    });

    playPauseBtn.addEventListener('click', () => {
      initAudio();
      if (audioElement.paused) {
        audioElement.play();
        isPlaying = true;
        playPauseBtn.textContent = 'Pause';
      } else {
        audioElement.pause();
        isPlaying = false;
        playPauseBtn.textContent = 'Play';
      }
    });

    colorBtn.addEventListener('click', () => {
      palette = generatePalette();
    });

    audioElement.addEventListener('ended', () => {
      isPlaying = false;
      playPauseBtn.textContent = 'Play';
    });

    function draw() {
      requestAnimationFrame(draw);

      const width = window.innerWidth;
      const height = window.innerHeight;

      // Subtle fade trail effect
      ctx.fillStyle = palette.bg;
      ctx.globalAlpha = 0.28;
      ctx.fillRect(0, 0, width, height);
      ctx.globalAlpha = 1.0;

      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const freqData = new Uint8Array(bufferLength);
      const waveData = new Uint8Array(bufferLength);

      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(waveData);

      // Calculate bass energy (first few frequency bins) for reactive pulse
      let bassSum = 0;
      for (let i = 0; i < 8; i++) bassSum += freqData[i];
      const bassAvg = bassSum / 8 / 255;

      // 1. Mirrored Frequency Bars (Center-out)
      const usableBins = Math.floor(bufferLength * 0.75); // Trim ultra-high empty frequencies
      const barWidth = (width / usableBins) * 0.8;
      const gap = (width / usableBins) * 0.2;

      const gradient = ctx.createLinearGradient(0, height * 0.2, 0, height * 0.8);
      gradient.addColorStop(0, palette.secondary);
      gradient.addColorStop(0.5, palette.primary);
      gradient.addColorStop(1, palette.secondary);

      ctx.fillStyle = gradient;

      for (let i = 0; i < usableBins; i++) {
        const value = freqData[i] / 255;
        const barHeight = value * (height * 0.55);
        const x = i * (barWidth + gap);
        const y = (height - barHeight) / 2;

        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, Math.max(barHeight, 2), 4);
        ctx.fill();
      }

      // 2. Oscilloscope Waveform Line
      ctx.lineWidth = 2.5 + bassAvg * 3;
      ctx.strokeStyle = palette.wave;
      ctx.shadowBlur = 15;
      ctx.shadowColor = palette.glow;

      ctx.beginPath();
      const sliceWidth = width / bufferLength;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const v = waveData[i] / 128.0; // 1.0 is center line
        const y = (v * height) / 2;

        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
        x += sliceWidth;
      }

      ctx.lineTo(width, height / 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    draw();
  </script>
</body>
</html>
